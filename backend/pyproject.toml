[project]
name = "agenthub-backend"
version = "0.1.0"
description = "AgentHub backend — 5-layer onion architecture (L1-L4)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",    # pyflakes + pycodestyle
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "ASYNC",     # flake8-async (CR-12: 禁止同步阻塞)
    "T20",       # flake8-print (CR-01: 禁止 print)
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # RUF=中文注释/docstring 项目惯例

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]  # 测试文件允许 print 调试

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
