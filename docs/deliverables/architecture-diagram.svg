<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="L5Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="L4Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="L3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="L2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="L1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1280" height="880" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">AgentHub 5 层洋葱架构</text>
  <text x="640" y="68" text-anchor="middle" font-size="13" fill="#64748b">依赖方向: L5 → L4 → L3 → L2 ← L1 (依赖倒置: L1 实现 L2 接口) | 跨层通信: Command (下行) + Domain Event (上行)</text>

  <!-- L5 Presentation -->
  <g>
    <rect x="60" y="92" width="1160" height="118" rx="10" fill="url(#L5Grad)" opacity="0.95"/>
    <text x="80" y="120" font-size="20" font-weight="700" fill="#ffffff">L5 Presentation  展示层</text>
    <text x="80" y="142" font-size="12" fill="#e9d5ff">React 18 + TypeScript Strict + Vite + Tailwind 3 + Zustand 4</text>

    <rect x="80" y="156" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="165" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">ChatView</text>
    <text x="165" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">IM 聊天主界面</text>

    <rect x="260" y="156" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="345" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">AgentPanel</text>
    <text x="345" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">AI 队友列表</text>

    <rect x="440" y="156" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="525" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">TaskBoard</text>
    <text x="525" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">任务看板</text>

    <rect x="620" y="156" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="705" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Inbox</text>
    <text x="705" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">收件箱</text>

    <rect x="800" y="156" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="885" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">McpMarket</text>
    <text x="885" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">MCP 接入市场</text>

    <rect x="980" y="156" width="220" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="1090" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Settings + Stores + Hooks</text>
    <text x="1090" y="189" text-anchor="middle" font-size="10" fill="#6b21a8">Zustand stores (6) + services 层</text>
  </g>

  <!-- L5 -> L4 arrow -->
  <line x1="640" y1="212" x2="640" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="650" y="227" font-size="10" fill="#475569">Command (HTTP/WS)</text>

  <!-- L4 API Gateway -->
  <g>
    <rect x="60" y="240" width="1160" height="118" rx="10" fill="url(#L4Grad)" opacity="0.95"/>
    <text x="80" y="268" font-size="20" font-weight="700" fill="#ffffff">L4 API Gateway  接口层</text>
    <text x="80" y="290" font-size="12" fill="#dbeafe">FastAPI Routers + WebSocket Handlers | Middleware: Auth(JWT) / CORS / RateLimit</text>

    <rect x="80" y="304" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="165" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">AgentRouter</text>
    <text x="165" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/agents</text>

    <rect x="260" y="304" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="345" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">GroupRouter</text>
    <text x="345" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/groups</text>

    <rect x="440" y="304" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="525" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">SessionRouter</text>
    <text x="525" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/sessions</text>

    <rect x="620" y="304" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="705" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">TaskRouter</text>
    <text x="705" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/tasks</text>

    <rect x="800" y="304" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="885" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">InboxRouter</text>
    <text x="885" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/inbox</text>

    <rect x="980" y="304" width="220" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="1090" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">McpRouter + WS Handlers</text>
    <text x="1090" y="337" text-anchor="middle" font-size="10" fill="#1e3a8a">/api/mcp/* + /ws/sessions/{id}</text>
  </g>

  <!-- L4 -> L3 arrow -->
  <line x1="640" y1="360" x2="640" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- L3 Application -->
  <g>
    <rect x="60" y="388" width="1160" height="118" rx="10" fill="url(#L3Grad)" opacity="0.95"/>
    <text x="80" y="416" font-size="20" font-weight="700" fill="#ffffff">L3 Application  应用层</text>
    <text x="80" y="438" font-size="12" fill="#d1fae5">跨领域编排 / 事务管理 / 权限校验 / 事件发布 | LLM 工具循环调度</text>

    <rect x="80" y="452" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="165" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">AgentService</text>
    <text x="165" y="485" text-anchor="middle" font-size="10" fill="#064e3b">CRUD + 加密 + draft</text>

    <rect x="260" y="452" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="345" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">GroupService</text>
    <text x="345" y="485" text-anchor="middle" font-size="10" fill="#064e3b">协调者自动创建</text>

    <rect x="440" y="452" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="525" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">ChatService</text>
    <text x="525" y="485" text-anchor="middle" font-size="10" fill="#064e3b">dispatch + 流式</text>

    <rect x="620" y="452" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="705" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">TaskService</text>
    <text x="705" y="485" text-anchor="middle" font-size="10" fill="#064e3b">DAG 编译 + 并发</text>

    <rect x="800" y="452" width="170" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="885" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">CoordinatorService</text>
    <text x="885" y="485" text-anchor="middle" font-size="10" fill="#064e3b">意图检测 + 任务拆解</text>

    <rect x="980" y="452" width="220" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="1090" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Mcp*Service (5) + InboxService</text>
    <text x="1090" y="485" text-anchor="middle" font-size="10" fill="#064e3b">market/install/binding/create/audit</text>
  </g>

  <!-- L3 -> L2 arrow -->
  <line x1="640" y1="508" x2="640" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- L2 Domain -->
  <g>
    <rect x="60" y="536" width="1160" height="118" rx="10" fill="url(#L2Grad)" opacity="0.95"/>
    <text x="80" y="564" font-size="20" font-weight="700" fill="#ffffff">L2 Domain  领域层</text>
    <text x="80" y="586" font-size="12" fill="#fef3c7">Agent / Group / Session / Message / Task  聚合根 | TaskEngine (Coordinator + Harness 分离) | FSM + Validators + DomainEvents</text>

    <rect x="80" y="600" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="180" y="617" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Aggregates (5)</text>
    <text x="180" y="633" text-anchor="middle" font-size="10" fill="#78350f">Agent / Group / Session / Message / Task</text>

    <rect x="290" y="600" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="390" y="617" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">TaskEngine</text>
    <text x="390" y="633" text-anchor="middle" font-size="10" fill="#78350f">Coordinator(LLM) + Harness(纯代码)</text>

    <rect x="500" y="600" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="600" y="617" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">TaskFSM</text>
    <text x="600" y="633" text-anchor="middle" font-size="10" fill="#78350f">PENDING→QUEUED→RUNNING→COMPLETED</text>

    <rect x="710" y="600" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="810" y="617" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">UnifiedAgent ABC</text>
    <text x="810" y="633" text-anchor="middle" font-size="10" fill="#78350f">LLMAdapter + AgentRuntime</text>

    <rect x="920" y="600" width="280" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="1060" y="617" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">MCP Domain (3 entities + rules)</text>
    <text x="1060" y="633" text-anchor="middle" font-size="10" fill="#78350f">mcp_server / installation / binding + 8 rules</text>
  </g>

  <!-- L1 Infrastructure -->
  <g>
    <rect x="60" y="684" width="1160" height="118" rx="10" fill="url(#L1Grad)" opacity="0.95"/>
    <text x="80" y="712" font-size="20" font-weight="700" fill="#ffffff">L1 Infrastructure  基础设施层</text>
    <text x="80" y="734" font-size="12" fill="#fee2e2">PostgreSQL (SQLAlchemy) / Redis (Pub-Sub) / FileSystem | LLM Adapters + Agent Runtimes (CLI 优先) | WS Bridge</text>

    <rect x="80" y="748" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="180" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">PostgreSQL 16 + Alembic</text>
    <text x="180" y="781" text-anchor="middle" font-size="10" fill="#7f1d1d">10 migrations (0001-0010)</text>

    <rect x="290" y="748" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="390" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Redis 7 + SessionStore</text>
    <text x="390" y="781" text-anchor="middle" font-size="10" fill="#7f1d1d">热上下文 + Pub/Sub</text>

    <rect x="500" y="748" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="600" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">LLMAdapter (3)</text>
    <text x="600" y="781" text-anchor="middle" font-size="10" fill="#7f1d1d">Claude / OpenAI / Mock</text>

    <rect x="710" y="748" width="200" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="810" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">AgentRuntime (4)  CLI优先</text>
    <text x="810" y="781" text-anchor="middle" font-size="10" fill="#7f1d1d">ClaudeCode / OpenCode / Pi / Codex</text>

    <rect x="920" y="748" width="280" height="40" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="1060" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">WS Bridge + MCP Installer</text>
    <text x="1060" y="781" text-anchor="middle" font-size="10" fill="#7f1d1d">Broadcast + dry_run (单 Docker 限额)</text>
  </g>

  <!-- L1 -> L2 dependency inversion arrow (from L1 up to L2) -->
  <line x1="900" y1="684" x2="900" y2="660" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowUp)"/>
  <text x="910" y="678" font-size="10" fill="#0d9488" font-weight="600">依赖倒置: L1 实现 L2 接口</text>

  <!-- Cross-layer data flow (legend) -->
  <g>
    <rect x="60" y="820" width="600" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="78" y="840" font-size="12" font-weight="700" fill="#0f172a">跨层通信</text>
    <line x1="160" y1="836" x2="200" y2="836" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
    <text x="208" y="840" font-size="11" fill="#334155">Command 下行 (HTTP/WS 请求)</text>
    <line x1="430" y1="836" x2="470" y2="836" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowUp)"/>
    <text x="478" y="840" font-size="11" fill="#334155">Domain Event 上行 (Redis Pub/Sub)</text>
  </g>

  <g>
    <rect x="680" y="820" width="540" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="698" y="840" font-size="12" font-weight="700" fill="#0f172a">架构红线 (AR-01~06)</text>
    <text x="828" y="840" font-size="11" fill="#334155">5 层依赖方向 / 只加 Adapter / Harness 无 LLM / Agent 不直通 / FSM 事件溯源 / system-model 解耦</text>
  </g>
</svg>
