repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff (backend)
        files: ^src/backend/
        args: [--config, src/backend/pyproject.toml]
      - id: ruff-format
        name: ruff format (backend)
        files: ^src/backend/
        args: [--config, src/backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.23.0
    hooks:
      - id: eslint
        name: eslint (frontend)
        files: ^src/frontend/
        args: [--config, src/frontend/.eslintrc.json]
        additional_dependencies:
          - eslint@9.23.0

  - repo: local
    hooks:
      - id: tsc-typecheck
        name: TypeScript 类型检查
        entry: bash -c "cd src/frontend && npx tsc --noEmit"
        language: system
        files: ^src/frontend/
        pass_filenames: false

      - id: branch-name
        name: 分支命名检查
        entry: python scripts/check_branch.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: worklog-check
        name: 日志更新检查
        entry: python scripts/check_worklog.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: doc-check
        name: 文档结构检查
        entry: python scripts/check_docs.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: secret-scan
        name: 密钥泄露扫描
        entry: python scripts/check_secrets.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: dead-links
        name: 文档死链检查
        entry: python scripts/check_dead_links.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        name: STATUS.md markdownlint (严规则)
        files: ^STATUS\.md$
        stages: [pre-push]
