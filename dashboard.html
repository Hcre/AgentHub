<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHub · 协作看板</title>
<style>
  :root {
    /* Claude 官网风：暖米底 + 黏土强调色 */
    --bg: #f5f4ee; --surface: #ffffff; --surface-2: #faf9f4;
    --border: #e7e4da; --border-strong: #ddd9cc;
    --ink: #1f1d1a; --ink-soft: #4a4640; --muted: #8a857b; --faint: #b3ada1;
    --clay: #cc785c; --clay-deep: #b35f44; --clay-tint: #f6e9e2;
    --green: #5b8a5a; --green-tint: #e7efe3;
    --blue: #5a7da3; --blue-tint: #e6edf4;
    --amber: #b8862f; --amber-tint: #f5ecd6;
    --red: #c0573f; --red-tint: #f6e2dc;
    --serif: 'Tiempos Text', 'Iowan Old Style', Georgia, 'Songti SC', 'STSong', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', ui-sans-serif, sans-serif;
    --mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
    --shadow: 0 1px 2px rgba(40,33,26,.04), 0 4px 16px rgba(40,33,26,.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--ink);
    line-height: 1.6; padding: 3rem 1.5rem 5rem; max-width: 980px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--clay-deep); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  code { background: var(--surface-2); border: 1px solid var(--border); padding: .1rem .4rem;
         border-radius: 5px; font-size: .85em; font-family: var(--mono); }

  /* ---- header ---- */
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;
           padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 1.85rem; letter-spacing: -.01em; color: var(--ink); }
  h1 .dot { color: var(--clay); }
  .tabs { margin-top: .7rem; display: flex; gap: .4rem; }
  .tab {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 8px; padding: .4rem .9rem; cursor: pointer; font-size: .9rem; font-family: var(--sans);
    transition: all .15s; display: inline-flex; align-items: center; gap: .4rem;
  }
  .tab:hover { color: var(--ink-soft); background: var(--surface-2); }
  .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .controls { display: flex; align-items: center; gap: 1rem; }
  .stamp { font-size: .76rem; color: var(--faint); text-align: right; line-height: 1.45; }
  .stamp b { color: var(--muted); font-weight: 600; }
  .stamp .stale { color: var(--amber); font-weight: 600; }
  .btn {
    background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink-soft);
    border-radius: 8px; padding: .5rem .9rem; cursor: pointer; font-size: .82rem; font-family: var(--sans);
    display: inline-flex; align-items: center; gap: .45rem; transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover { border-color: var(--clay); color: var(--clay-deep); background: var(--clay-tint); }
  .btn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- summary ---- */
  .summary { margin-top: 2rem; background: var(--surface); border: 1px solid var(--border);
             border-radius: 16px; padding: 1.75rem 1.9rem; box-shadow: var(--shadow); }
  .summary-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
  .summary-top h2 { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; color: var(--ink-soft); }
  .pct { font-family: var(--serif); font-size: 3rem; font-weight: 500; line-height: 1; color: var(--clay); letter-spacing: -.02em; }
  .pct small { font-size: 1rem; color: var(--muted); font-family: var(--sans); margin-left: .5rem; }
  .sub { color: var(--muted); font-size: .88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.4rem; }
  .chip { border: 1px solid var(--border-strong); border-radius: 999px; padding: .38rem .85rem; font-size: .82rem;
          cursor: pointer; color: var(--ink-soft); background: var(--surface); user-select: none;
          transition: all .15s; display: inline-flex; align-items: center; }
  .chip:hover { border-color: var(--muted); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.active .n { color: #fff; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: .5rem; }
  .chip .n { font-weight: 700; color: var(--ink); margin-right: .32rem; }
  .d-done { background: var(--green); } .d-active { background: var(--blue); }
  .d-pending { background: var(--faint); } .d-blocked { background: var(--red); }

  /* ---- cards ---- */
  .cards { margin-top: 1.5rem; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
          padding: 1rem 1.15rem; border-left: 3px solid var(--border-strong);
          transition: transform .14s ease, box-shadow .14s ease, border-color .14s; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card.s-done { border-left-color: var(--green); }
  .card.s-active { border-left-color: var(--blue); }
  .card.s-pending { border-left-color: var(--faint); }
  .card.s-blocked { border-left-color: var(--red); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; }
  .card-title { font-weight: 600; font-size: .98rem; color: var(--ink); }
  .badge { padding: .18rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 600; white-space: nowrap; flex: 0 0 auto; }
  .badge-done { background: var(--green-tint); color: var(--green); }
  .badge-active { background: var(--blue-tint); color: var(--blue); }
  .badge-pending { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .badge-blocked { background: var(--red-tint); color: var(--red); }
  .card-meta { color: var(--muted); font-size: .79rem; margin-top: .55rem; display: flex; gap: .7rem; flex-wrap: wrap; }

  /* ---- sections ---- */
  .section { margin-top: 2.5rem; }
  .section h2 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin-bottom: .9rem;
                display: flex; align-items: center; gap: .5rem; }
  .section h2 .count { font-family: var(--sans); font-size: .78rem; color: var(--muted); font-weight: 500; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
         padding: .8rem 1.1rem; margin-bottom: .6rem; font-size: .9rem; color: var(--ink-soft); }
  .row.blocked { border-left: 3px solid var(--red); }

  /* ---- gate table ---- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 580px; }
  th, td { padding: .65rem .9rem; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; color: var(--ink-soft); }
  th { color: var(--muted); font-weight: 600; background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  .empty { color: var(--muted); text-align: center; padding: 2.75rem 1.25rem;
           border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--surface); }
  .empty.error { border-color: var(--red); color: var(--ink-soft); }
  .empty.error b { color: var(--red); }
  footer { text-align: center; color: var(--faint); font-size: .78rem; margin-top: 4rem;
           padding-top: 1.5rem; border-top: 1px solid var(--border); }

  /* ---- docs view ---- */
  #view-docs { margin-top: 2rem; }
  .doc-nav { display: flex; flex-wrap: wrap; gap: .55rem; margin-bottom: 1.5rem; }
  .doc-pill { border: 1px solid var(--border-strong); border-radius: 999px; padding: .42rem .95rem; font-size: .85rem;
              cursor: pointer; color: var(--ink-soft); background: var(--surface); user-select: none;
              transition: all .15s; display: inline-flex; align-items: center; gap: .45rem; }
  .doc-pill:hover { border-color: var(--clay); color: var(--clay-deep); }
  .doc-pill.active { background: var(--clay); border-color: var(--clay); color: #fff; }
  .doc-pill code { background: rgba(255,255,255,.18); border: none; color: inherit; padding: 0 .2rem; }
  .doc-pill:not(.active) code { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }

  .doc-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
  .doc-toc { flex: 0 0 196px; position: sticky; top: 1.5rem; max-height: 86vh; overflow-y: auto;
             font-size: .82rem; padding: .2rem .4rem .2rem 0; }
  .doc-toc .toc-title { font-weight: 600; color: var(--muted); font-size: .72rem; letter-spacing: .04em;
                        text-transform: uppercase; margin-bottom: .6rem; }
  .toc-link { display: block; color: var(--ink-soft); padding: .22rem 0 .22rem .7rem; cursor: pointer;
              border-left: 2px solid var(--border); line-height: 1.4; transition: all .12s; }
  .toc-link:hover { color: var(--clay-deep); border-left-color: var(--clay); text-decoration: none; background: var(--surface-2); }
  .toc-link.lvl3 { padding-left: 1.5rem; font-size: .96em; color: var(--muted); }
  .doc-panel { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
               padding: 2.25rem 2.5rem; box-shadow: var(--shadow); min-height: 12rem; }
  .doc-source { font-size: .76rem; color: var(--faint); margin-bottom: 1.25rem; padding-bottom: 1rem;
                border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .doc-source code { font-size: .9em; }

  /* ---- rendered markdown (.md-body) ---- */
  .md-body { color: var(--ink-soft); font-size: .92rem; line-height: 1.72; }
  .md-body > :first-child { margin-top: 0; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
    font-family: var(--serif); font-weight: 500; color: var(--ink); line-height: 1.3;
    margin: 1.8rem 0 .8rem; letter-spacing: -.01em; scroll-margin-top: 1rem; }
  .md-body h1 { font-size: 1.7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--border); }
  .md-body h2 { font-size: 1.35rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
  .md-body h3 { font-size: 1.12rem; }
  .md-body h4 { font-size: 1rem; }
  .md-body h5, .md-body h6 { font-size: .9rem; color: var(--ink-soft); }
  .md-body p { margin: .8rem 0; }
  .md-body ul, .md-body ol { margin: .7rem 0; padding-left: 1.5rem; }
  .md-body li { margin: .3rem 0; }
  .md-body li > ul, .md-body li > ol { margin: .3rem 0; }
  .md-body a { color: var(--clay-deep); }
  .md-body strong { color: var(--ink); font-weight: 600; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 1.8rem 0; }
  .md-body blockquote { border-left: 3px solid var(--clay); background: var(--clay-tint);
                        margin: 1rem 0; padding: .6rem 1.1rem; border-radius: 0 8px 8px 0; color: var(--ink-soft); }
  .md-body blockquote > :first-child { margin-top: 0; } .md-body blockquote > :last-child { margin-bottom: 0; }
  .md-body code { background: var(--surface-2); border: 1px solid var(--border); padding: .1rem .4rem;
                  border-radius: 5px; font-size: .85em; font-family: var(--mono); color: var(--clay-deep); }
  .md-body pre { background: #2b2823; border: 1px solid var(--border-strong); border-radius: 10px;
                 padding: 1rem 1.2rem; overflow-x: auto; margin: 1rem 0; }
  .md-body pre code { background: none; border: none; padding: 0; color: #e9e4d8; font-size: .82rem; line-height: 1.6; }
  .md-callout { background: var(--blue-tint); border: 1px solid #cdd9e6; border-left: 3px solid var(--blue);
                border-radius: 0 8px 8px 0; padding: .8rem 1.1rem; margin: 1rem 0; font-size: .88rem; color: var(--ink-soft); }
  .md-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; margin: 1.1rem 0; }
  .md-body table.md-table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 0; }
  .md-body table.md-table th, .md-body table.md-table td {
    padding: .55rem .85rem; text-align: left; border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border); white-space: normal; vertical-align: top; }
  .md-body table.md-table th { background: var(--surface-2); color: var(--ink-soft); font-weight: 600; }
  .md-body table.md-table tr:last-child td { border-bottom: none; }
  .md-body table.md-table th:last-child, .md-body table.md-table td:last-child { border-right: none; }
  .md-body table.md-table tbody tr:hover { background: var(--surface-2); }

  /* ---- graph view ---- */
  #view-graph { margin-top: 2rem; }
  .graph-frame { width: 100%; height: 80vh; border: 1px solid var(--border); border-radius: 16px;
                 background: var(--surface); box-shadow: var(--shadow); }

  .hidden { display: none !important; }
  @media (max-width: 760px) {
    .doc-layout { flex-direction: column; }
    .doc-toc { position: static; flex-basis: auto; max-height: none; width: 100%;
               border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: .5rem; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>AgentHub<span class="dot"> · </span>协作看板</h1>
    <nav class="tabs">
      <button class="tab active" data-view="board">📊 看板</button>
      <button class="tab" data-view="docs">📖 文档</button>
      <button class="tab" data-view="graph">🗺️ 图谱</button>
    </nav>
  </div>
  <div class="controls">
    <div class="stamp" id="stamp">—</div>
    <button class="btn" id="refresh" title="立即刷新">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
      刷新
    </button>
  </div>
</header>

<!-- ===== 看板视图 ===== -->
<main id="view-board">
  <section class="summary">
    <div class="summary-top">
      <h2>本周完成</h2>
      <span class="pct"><span id="pct">0</span><small id="count">项 · — 人</small></span>
    </div>
    <p class="sub" id="summary-sub">正在加载 STATUS.md …</p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="section" id="map-section" hidden>
    <h2>🧭 Git ↔ 目录映射 <span class="count" id="map-count"></span></h2>
    <div class="table-wrap"><table id="map-table"></table></div>
  </section>
</main>

<!-- ===== 文档视图 ===== -->
<main id="view-docs" class="hidden">
  <nav class="doc-nav" id="doc-nav"></nav>
  <div class="doc-layout">
    <aside class="doc-toc hidden" id="doc-toc"></aside>
    <section class="doc-panel">
      <div class="doc-source" id="doc-source"></div>
      <article class="md-body" id="doc-body"><div class="empty">选择上方文档查看</div></article>
    </section>
  </div>
</main>

<!-- ===== 图谱视图 ===== -->
<main id="view-graph" class="hidden">
  <iframe id="graph-frame" class="graph-frame hidden" title="代码依赖图谱"></iframe>
  <div class="empty error hidden" id="graph-fallback"></div>
</main>

<footer>看板源 <code>STATUS.md</code> · 文档实时渲染各 <code>README</code> / <code>docs/CODE_MAP.md</code> · 图谱内嵌 <code>.understand-anything/graph.html</code> · 看板每 60 秒原地刷新</footer>

<script>
"use strict";
const REFRESH_MS = 60000;
const state = { filter: "all", countdown: REFRESH_MS / 1000, loaded: false, stale: false, lastData: null, view: "board" };
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// 人向文档清单（实时 fetch + 内置渲染）
const DOCS = [
  { id: "readme",   label: "总览 README",  path: "README.md",                 hint: "项目入口（人向）" },
  { id: "conv",     label: "规范导航",      path: "docs/conventions/README.md", hint: "开发规范 01-08" },
  { id: "explore",  label: "Explore 索引",  path: "docs/explore/README.md",     hint: "技术探索文档" },
  { id: "frontend", label: "前端 README",   path: "src/frontend/README.md",     hint: "前端工程说明" },
  { id: "codemap",  label: "CODE_MAP",      path: "docs/CODE_MAP.md",           hint: "后端模块全景（Mermaid → 见图谱）" },
];
const GRAPH_SRC = ".understand-anything/graph.html";

// ======================================================================
// 内置 mini-markdown 渲染器（无外部依赖）
// 支持：标题 / 表格 / 代码块(含 mermaid 转图谱提示) / 行内代码 / 加粗 / 斜体 / 链接 / 列表(嵌套) / 引用 / 分割线
// ======================================================================
const SENT = String.fromCharCode(0xE000);    // 行内代码占位哨兵（私有区字符：regex 安全且不会出现在正文）
const PIPE_PH = String.fromCharCode(0xE001); // 转义管道 \| 的占位（NUL 在 RegExp 中不可靠，故用私有区）

function inline(t) {
  const codes = [];
  // 1) 先抽出行内代码，避免内部内容被当作其它语法处理
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return SENT + (codes.length - 1) + SENT; });
  // 2) 转义 HTML
  t = esc(t);
  // 3) 加粗 / 斜体
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?=[^*\w]|$)/g, "$1<em>$2</em>");
  // 4) 链接 [text](url)，外链新窗口
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => {
    const u = esc(url), ext = /^https?:\/\//.test(url);
    return `<a href="${u}"${ext ? ' target="_blank" rel="noopener"' : ""}>${txt}</a>`;
  });
  // 5) 还原行内代码
  t = t.replace(new RegExp(SENT + "(\\d+)" + SENT, "g"), (_, n) => `<code>${esc(codes[+n])}</code>`);
  return t;
}

function splitRow(line) {
  const s = line.trim().replace(/^\|/, "").replace(/\|$/, "").replace(/\\\|/g, PIPE_PH);
  return s.split("|").map(c => inline(c.split(PIPE_PH).join("|").trim()));
}

function renderTable(header, rows) {
  const th = header.map(h => `<th>${h}</th>`).join("");
  const body = rows.map(r =>
    `<tr>${header.map((_, i) => `<td>${r[i] || ""}</td>`).join("")}</tr>`).join("");
  return `<div class="md-table-wrap"><table class="md-table"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderList(block) {
  const items = [];
  for (const l of block) {
    const m = l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (m) items.push({ indent: m[1].replace(/\t/g, "  ").length, ordered: /\d/.test(m[2]), text: m[3] });
    else if (items.length) items[items.length - 1].text += " " + l.trim();
  }
  if (!items.length) return "";
  let pos = 0;
  function level(indent) {
    const ordered = items[pos].ordered;
    let out = ordered ? "<ol>" : "<ul>";
    while (pos < items.length && items[pos].indent >= indent) {
      if (items[pos].indent > indent) { out += level(items[pos].indent); continue; }
      const cur = items[pos]; pos++;
      let li = inline(cur.text);
      if (pos < items.length && items[pos].indent > cur.indent) li += level(items[pos].indent);
      out += `<li>${li}</li>`;
    }
    return out + (ordered ? "</ol>" : "</ul>");
  }
  return level(items[0].indent);
}

function mdToHtml(md) {
  let lines = md.replace(/\r\n/g, "\n").split("\n");
  // 跳过 YAML front-matter
  if (lines[0] && lines[0].trim() === "---") {
    const end = lines.indexOf("---", 1);
    if (end > 0) lines = lines.slice(end + 1);
  }
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 代码块（捕获语言：mermaid → 转为「见图谱」提示，避免一坨原始文本）
    const fence = line.match(/^\s*(```|~~~)\s*([\w-]*)/);
    if (fence) {
      const marker = fence[1], lang = (fence[2] || "").toLowerCase(), buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(marker)) { buf.push(lines[i]); i++; }
      i++;
      if (lang === "mermaid") {
        out.push(`<div class="md-callout">🗺️ <strong>Mermaid 依赖图</strong> —— 点 <a href="#" onclick="switchView('graph');return false;">「图谱」Tab</a> 看交互式可视化（点节点高亮上下游），或在 GitHub/VSCode 打开本文件渲染。</div>`);
      } else {
        out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      }
      continue;
    }

    // 表格：当前行是 | … |，下一行是分隔行 | --- | --- |
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const header = splitRow(line); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|?\s*$/.test(lines[i]) && lines[i].includes("|")) {
        rows.push(splitRow(lines[i])); i++;
      }
      out.push(renderTable(header, rows));
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2].replace(/\s*#+\s*$/, ""))}</h${h[1].length}>`); i++; continue; }

    // 分割线
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

    // 引用（连续收集后递归渲染）
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push(`<blockquote>${mdToHtml(buf.join("\n"))}</blockquote>`);
      continue;
    }

    // 列表（含缩进续行）
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const block = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) || (block.length && /^\s+\S/.test(lines[i])))) {
        block.push(lines[i]); i++;
      }
      out.push(renderList(block));
      continue;
    }

    // 空行
    if (/^\s*$/.test(line)) { i++; continue; }

    // 段落
    const buf = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^#{1,6}\s/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
           !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*(```|~~~)/.test(lines[i]) &&
           !/^\s*>\s?/.test(lines[i]) && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

// 给 h2/h3 加锚点 id，并抽出目录 TOC（阅读友好导航）
function buildToc(html) {
  const toc = [];
  let n = 0;
  const out = html.replace(/<h([23])>([\s\S]*?)<\/h\1>/g, (_, lvl, inner) => {
    const id = "sec-" + (n++);
    toc.push({ id, lvl: +lvl, text: inner.replace(/<[^>]+>/g, "") });
    return `<h${lvl} id="${id}">${inner}</h${lvl}>`;
  });
  return { html: out, toc };
}

// ======================================================================
// 看板：STATUS.md 解析 + 渲染
// ======================================================================
const isBlocked = b => !!b && !/^无$|^—$|^-$/.test(b.trim());
const doneCount = s => (s.match(/✅/g) || []).length;
function splitDone(s) {
  if (!s) return [];
  return s.split("✅").map(x => x.replace(/^[\s+·、]+|[\s+·、]+$/g, "").trim())
          .filter(x => x && x !== "—" && x !== "-");
}

function parse(md) {
  const lines = md.split(/\r?\n/);
  const out = { people: [], gitmap: [], updated: "", legend: [] };
  let section = "head";
  for (const raw of lines) {
    const line = raw.trim();
    const dm = line.match(/^>\s*(?:最后)?更新[:：]\s*(.+)$/);
    if (dm) out.updated = dm[1].trim();
    if (line.startsWith("## ")) {
      const h = line.slice(3);
      section = h.includes("Git") || h.includes("映射") ? "gitmap"
        : h.includes("图例") ? "legend" : "other";
      continue;
    }
    const isRow = line.startsWith("|") && !/^\|[\s|:-]+\|?$/.test(line);
    if (isRow) {
      const cols = line.split("|").slice(1, -1).map(c => c.trim());
      if ((section === "head" || section === "other") && cols[0] && cols[0] !== "我"
          && !/^Git用户名$/.test(cols[0]) && cols.length >= 4) {
        out.people.push({ who: cols[0], doing: cols[1] || "", blocked: cols[2] || "", done: cols[3] || "" });
      } else if (section === "gitmap" && cols[0] && cols[0] !== "Git用户名") {
        out.gitmap.push({ user: cols[0], dir: cols[1] || "" });
      }
    }
    if (line.startsWith("- ") && section === "legend") out.legend.push(line.slice(2).trim());
  }
  return out;
}

function renderSummary(data) {
  const ppl = data.people;
  const totalDone = ppl.reduce((n, p) => n + doneCount(p.done), 0);
  const blocked = ppl.filter(p => isBlocked(p.blocked)).length;
  document.getElementById("pct").textContent = totalDone;
  document.getElementById("count").textContent = `项 · ${ppl.length} 人`;
  document.getElementById("summary-sub").textContent = ppl.length
    ? `${ppl.length} 人在协作，本周累计完成 ${totalDone} 项${blocked ? `，${blocked} 人有阻塞` : "，无阻塞"}。`
    : "未解析到协作成员（STATUS.md 应含「我｜正在做｜阻塞？｜这周完成了」表）。";

  const defs = [
    ["all", "全部", ppl.length, ""],
    ["active", "进行中", ppl.filter(p => p.doing && !isBlocked(p.blocked)).length, "d-active"],
    ["blocked", "有阻塞", blocked, "d-blocked"],
  ];
  const chips = document.getElementById("chips");
  chips.innerHTML = defs.map(([k, lbl, n, dot]) =>
    `<button class="chip ${state.filter === k ? "active" : ""}" data-k="${k}">
       ${dot ? `<span class="dot ${dot}"></span>` : ""}<span class="n">${n}</span>${lbl}
     </button>`).join("");
  chips.querySelectorAll(".chip").forEach(c =>
    c.onclick = () => { state.filter = c.dataset.k; render(data); });
}

function renderCards(data) {
  let ppl = data.people;
  if (state.filter === "blocked") ppl = ppl.filter(p => isBlocked(p.blocked));
  else if (state.filter === "active") ppl = ppl.filter(p => p.doing && !isBlocked(p.blocked));
  const el = document.getElementById("cards");
  if (!ppl.length) { el.innerHTML = `<div class="empty">该筛选下暂无成员</div>`; return; }
  el.innerHTML = ppl.map(p => {
    const blk = isBlocked(p.blocked);
    const k = blk ? "blocked" : (p.doing ? "active" : "pending");
    const dir = (data.gitmap.find(g => g.dir === p.who) || {}).user;
    const dones = splitDone(p.done);
    const doneHtml = dones.length
      ? `<ul style="margin:.5rem 0 0;padding-left:1.1rem;color:var(--ink-soft);font-size:.83rem">`
        + dones.map(d => `<li style="margin:.15rem 0">✅ ${esc(d)}</li>`).join("") + `</ul>`
      : `<div class="card-meta">本周暂无完成项</div>`;
    return `<article class="card s-${k}">
      <div class="card-head">
        <span class="card-title">${esc(p.who)}${dir ? ` <span style="color:var(--faint);font-weight:400;font-size:.78rem">(${esc(dir)})</span>` : ""}</span>
        <span class="badge badge-${blk ? "blocked" : "active"}">${blk ? "阻塞" : "进行中"}</span>
      </div>
      <div class="card-meta" style="margin-top:.5rem"><span>🔧 正在做：${esc(p.doing) || "—"}</span></div>
      ${blk ? `<div class="row blocked" style="margin-top:.55rem">🚫 ${esc(p.blocked)}</div>` : ""}
      <div style="margin-top:.55rem;font-size:.82rem;color:var(--muted)">本周完成 ${dones.length} 项${doneHtml}</div>
    </article>`;
  }).join("");
}

function renderGitMap(gitmap) {
  const sec = document.getElementById("map-section");
  sec.hidden = !gitmap.length;
  if (!gitmap.length) return;
  document.getElementById("map-count").textContent = `(${gitmap.length})`;
  document.getElementById("map-table").innerHTML =
    `<thead><tr><th>Git 用户名</th><th>日志目录</th></tr></thead>` +
    `<tbody>${gitmap.map(g => `<tr><td><code>${esc(g.user)}</code></td><td>worklogs/${esc(g.dir)}/</td></tr>`).join("")}</tbody>`;
}

function render(data) {
  state.lastData = data;
  renderSummary(data);
  renderCards(data);
  renderGitMap(data.gitmap);
  state.loaded = true;
}

function setStamp() {
  const u = state.lastData?.updated;
  const tail = state.stale ? `<span class="stale">⚠ 刷新失败，显示上次数据</span>` : `${state.countdown}s 后刷新`;
  document.getElementById("stamp").innerHTML = (u ? `<b>更新</b> ${esc(u)}<br>` : "") + tail;
}

async function load() {
  const btn = document.getElementById("refresh");
  btn.classList.add("spin");
  try {
    const res = await fetch("STATUS.md", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(parse(await res.text()));
    state.stale = false;
  } catch (e) {
    if (!state.loaded) {
      document.getElementById("cards").innerHTML =
        `<div class="empty error"><b>⚠️ 无法加载 STATUS.md</b><br><br>
         本页需通过 HTTP 服务访问，不能用 <code>file://</code> 直接打开。<br>
         双击 <code>scripts/打开仪表盘.bat</code>，或运行 <code>python scripts/start_server.py</code>。<br>
         <small>(${esc(e.message)})</small></div>`;
    } else {
      state.stale = true;
    }
  } finally {
    state.countdown = REFRESH_MS / 1000;
    setStamp();
    btn.classList.remove("spin");
  }
}

// ======================================================================
// 文档视图：fetch + 渲染 + 目录
// ======================================================================
const docCache = {};
let activeDoc = DOCS[0].id;

function renderDocNav() {
  document.getElementById("doc-nav").innerHTML = DOCS.map(d =>
    `<button class="doc-pill ${d.id === activeDoc ? "active" : ""}" data-id="${d.id}" title="${esc(d.hint)}">
       ${esc(d.label)} <code>${esc(d.path.split("/").pop())}</code>
     </button>`).join("");
  document.querySelectorAll(".doc-pill").forEach(b =>
    b.onclick = () => loadDoc(b.dataset.id));
}

function renderToc(toc) {
  const el = document.getElementById("doc-toc");
  if (toc.length < 2) { el.innerHTML = ""; el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML = `<div class="toc-title">目录</div>` +
    toc.map(t => `<span class="toc-link lvl${t.lvl}" data-id="${t.id}">${esc(t.text)}</span>`).join("");
  el.querySelectorAll(".toc-link").forEach(a => a.onclick = () => {
    const h = document.getElementById(a.dataset.id);
    if (h) h.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

function showDoc(id) {
  document.getElementById("doc-body").innerHTML = docCache[id].html;
  renderToc(docCache[id].toc);
}

async function loadDoc(id, force) {
  activeDoc = id;
  renderDocNav();
  const doc = DOCS.find(d => d.id === id);
  const src = document.getElementById("doc-source");
  src.innerHTML = `<span>📄 <code>${esc(doc.path)}</code> · ${esc(doc.hint)}</span><a href="${esc(doc.path)}" target="_blank" rel="noopener">查看原文 ↗</a>`;
  if (docCache[id] && !force) { showDoc(id); return; }
  document.getElementById("doc-body").innerHTML = `<div class="empty">加载中 …</div>`;
  document.getElementById("doc-toc").classList.add("hidden");
  try {
    const res = await fetch(doc.path, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    docCache[id] = buildToc(mdToHtml(await res.text()));
    showDoc(id);
  } catch (e) {
    document.getElementById("doc-body").innerHTML = `<div class="empty error"><b>⚠️ 无法加载 ${esc(doc.path)}</b><br><br>
      本页需通过 HTTP 服务访问（<code>python scripts/start_server.py</code>），不能用 <code>file://</code> 打开。<br>
      <small>(${esc(e.message)})</small></div>`;
  }
}

// ======================================================================
// 图谱视图：内嵌 .understand-anything/graph.html（生成产物，未入 git）
// ======================================================================
let graphLoaded = false;
async function loadGraph(force) {
  const frame = document.getElementById("graph-frame");
  const fb = document.getElementById("graph-fallback");
  if (graphLoaded && !force) return;
  try {
    const res = await fetch(GRAPH_SRC, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    frame.src = GRAPH_SRC + (force ? "?t=" + Date.now() : "");
    frame.classList.remove("hidden");
    fb.classList.add("hidden");
    graphLoaded = true;
  } catch (e) {
    frame.classList.add("hidden");
    fb.classList.remove("hidden");
    fb.innerHTML = `<b>⚠️ 图谱尚未生成</b><br><br>
      运行 <code>python scripts/gen_codegraph.py</code> 生成 <code>.understand-anything/graph.html</code>。<br>
      该文件是生成产物（未入 git），克隆后需先重建。<br>
      <small>(${esc(e.message)})</small>`;
  }
}

// ======================================================================
// Tab 切换
// ======================================================================
function switchView(view) {
  state.view = view;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  document.getElementById("view-board").classList.toggle("hidden", view !== "board");
  document.getElementById("view-docs").classList.toggle("hidden", view !== "docs");
  document.getElementById("view-graph").classList.toggle("hidden", view !== "graph");
  if (view === "docs" && !docCache[activeDoc]) loadDoc(activeDoc);
  if (view === "graph") loadGraph();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchView(t.dataset.view));

// 刷新按钮：按当前视图刷新对应内容
document.getElementById("refresh").onclick = () => {
  if (state.view === "docs") loadDoc(activeDoc, true);
  else if (state.view === "graph") loadGraph(true);
  else load();
};

setInterval(() => {
  if (state.view !== "board") return;
  state.countdown--;
  if (state.countdown <= 0) load();
  else setStamp();
}, 1000);

renderDocNav();
load();
</script>
</body>
</html>
