name: agenthub

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenthub_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenthub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ../../.agenthub/skills:/skills
      # - D:\:/mnt/host_d  # 宿主需有 D 盘；本机缺盘时取消注释
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:-agenthub_dev_pwd}@postgres:5432/${POSTGRES_DB:-agenthub}
      REDIS_URL: redis://redis:6379/0
      SKILLS_DIR: /skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:-agenthub_dev_pwd}@postgres:5432/${POSTGRES_DB:-agenthub}
      REDIS_URL: redis://redis:6379/0
      SKILLS_DIR: /skills
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.infrastructure.queue.celery_app worker --loglevel=info
    # 覆盖 backend 镜像继承的 HTTP /health 探针——celery 不跑 HTTP 服务，
    # 改用 celery inspect ping 探 worker 真实存活
    healthcheck:
      # 不带 -d：ping 所有在线 worker，任一回应即健康（CMD exec 形式不展开 $HOSTNAME，故不用 -d 指定节点）
      # -t 8：给 worker 经 broker 回应留足时间，避免默认 1s 超时误判
      test: ["CMD", "celery", "-A", "app.infrastructure.queue.celery_app", "inspect", "ping", "-t", "8"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 25s

  # 新前端：v0.dev 静态原型（nginx 托管，纯 mock 数据，不连后端）
  frontend:
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5174:5173"  # 主机 5174 → 容器 vite dev 5173（dev 模式，无 nginx）
    # 源文件 volume mount：host 改文件即生效（vite HMR 实时刷新），
    # 不再需要 docker compose build + up -d 重启
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/public:/app/public
      - ../frontend/vite.config.ts:/app/vite.config.ts
      # 4 个 tsconfig 全 mount（tsconfig.json 引用了 tsconfig.app/node/test）
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ../frontend/tsconfig.test.json:/app/tsconfig.test.json
    environment:
      - CHOKIDAR_USEPOLLING=true  # 跨平台 HMR 稳定（Windows + Docker Desktop 必开）
      - VITE_PROXY_TARGET=http://backend:8000  # Docker DNS 解析 backend 容器

volumes:
  pg_data:
  redis_data:
